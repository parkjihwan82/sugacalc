name: 안드로이드 앱(APK) 만들기

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 화면 파일을 앱에 복사
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          if [ -d icons ]; then cp -r icons android/app/src/main/assets/; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        run: gradle -p android assembleRelease --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk sugacalc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sugacalc-apk
          path: sugacalc.apk

      - name: 다운로드 페이지(Releases)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 수가계산 앱 v1.0.${{ github.run_number }}
          body: 아래 Assets에서 sugacalc.apk를 내려받아 안드로이드 휴대폰에 설치하세요.
          files: sugacalc.apk
